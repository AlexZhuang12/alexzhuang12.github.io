<h2>使用範圍</h2><p>信箱工作台目前提供 Windows 測試版。請只連接你有權存取的信箱，並遵守 Google、OpenAI 及所屬組織的使用規範。</p>
<h2>寄信與郵件資料</h2><p>按下「確認寄出」前，請檢查寄件帳號、所有收件人、主旨與內容。請勿用本工具寄送垃圾郵件、冒用他人身分或規避 Gmail 限制。</p>
<h2>可用性與停止使用</h2><p>功能可用性受 Google、OpenAI 和本機環境影響。你可以停止使用工具，並透過 Google 帳戶設定撤銷 Gmail 授權。</p>
<h2>聯絡</h2><p>使用問題可透過 <a href="https://github.com/AlexZhuang12">維護者 GitHub 個人頁面</a>的聯絡管道反映。</p>
