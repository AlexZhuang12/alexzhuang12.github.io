<body><header><nav aria-label="網站導覽"><a href="./">首頁</a><a href="privacy.html">隱私權政策</a><a href="terms.html">服務條款</a></nav></header><main><h1>信箱工作台</h1>
<p class="intro">在 Windows 用 Codex 查詢多個 Gmail 信箱、辨識郵件來源，並在確認內容後寄信。</p>
<h2>連接 Gmail</h2><p>在桌面工具新增信箱，在 Google 頁面選擇帳號並同意授權。每個信箱的授權各自管理。</p>
<h2>讀取與寄信權限</h2><p>讀取權限用於搜尋信箱並取得符合查詢的郵件資訊。寄信權限用於送出使用者在 Windows 預覽中確認的郵件。</p>
<h2>開發者</h2><p>信箱工作台由 <a href="https://github.com/AlexZhuang12">AlexZhuang12</a> 維護。</p>
